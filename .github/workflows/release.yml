name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: 4DArchive
  MACOS_DEPLOYMENT_TARGET: '10.13'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: libarchive-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Validate immutable source and publication availability before native work
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py preflight --sha "$EVENT_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Validate checkout and clean only Windows CMake outputs
        shell: pwsh
        run: |
          python -c "import os,sys; sys.path.insert(0,'.github/scripts'); import repository; repository.verify_checkout(os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { throw "Windows source validation failed" }
          python .github/scripts/native.py clean-windows
          if ($LASTEXITCODE -ne 0) { throw "Windows output cleanup failed" }

      - name: build with CMake
        shell: pwsh
        run: |
          cmake -S 4DArchive -B 4DArchive/cmake-build -A x64
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake configure failed" }
          cmake --build 4DArchive/cmake-build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake build failed" }
          $binary = "4DArchive/4DArchive-test/Plugins/4DArchive/Contents/Windows64/4DArchive.4DX"
          if (!(Test-Path -LiteralPath $binary -PathType Leaf) -or (Get-Item -LiteralPath $binary).Length -eq 0) {
            throw "Missing or empty Windows artifact"
          }

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: 4DArchive/4DArchive-test/Plugins/4DArchive/Contents/Windows64/4DArchive.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Recheck clean selected source and availability before native work
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py preflight --sha "$EVENT_SHA"

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build

      - name: merge Windows binaries and verify built metadata and resources
        run: bash .github/scripts/native.sh merge

      - name: codesign and strictly verify
        run: bash .github/scripts/native.sh sign

      - name: package, notarize & staple
        run: bash .github/scripts/native.sh package

      - name: Revalidate retained outputs and create only a new tag, release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release.py publish --sha "$EVENT_SHA" "$ZIP_PATH" "$DMG_PATH"
